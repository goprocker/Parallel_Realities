<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <style>
    text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#5c6874}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#526171}.screen{fill:#fff;stroke:#202a34;stroke-width:2}.line{fill:none;stroke:#465463;stroke-width:2}.accent{fill:none;stroke:#155eef;stroke-width:3}.fillAccent{fill:#155eef}.muted{fill:#edf2f7;stroke:#aab6c2;stroke-width:1.5}.article{fill:#f5f8fb;stroke:#aab6c2;stroke-width:1.5}.arrow{fill:none;stroke:#155eef;stroke-width:2.5;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#155eef"/></marker></defs>
  <rect width="1600" height="1180" fill="#f7f9fc"/>
  <text x="70" y="64" class="title">Frontend learning journey — wireframe</text>
  <text x="70" y="91" class="sub">Eight-screen flow inferred from the supplied sketches. Blue points/tiles are the primary navigation targets.</text>
  <g transform="translate(70,140)">
    <!-- 1 -->
    <g transform="translate(0,0)"><rect class="screen" width="330" height="340" rx="10"/><text x="18" y="29" class="label">01 · Home</text><rect class="muted" x="18" y="50" width="294" height="210" rx="5"/><path class="accent" d="M38 230 C95 96 190 95 288 77"/><circle class="fillAccent" cx="176" cy="128" r="8"/><text x="38" y="157" class="small">Visual hero</text><text x="18" y="289" class="small">Short project statement / welcome</text><rect class="fillAccent" x="18" y="303" width="128" height="24" rx="12"/><text x="37" y="320" style="font-size:12px;fill:#fff">Begin journey →</text></g>
    <!--2 -->
    <g transform="translate(400,0)"><rect class="screen" width="330" height="340" rx="10"/><text x="18" y="29" class="label">02 · Introduction</text><rect class="muted" x="18" y="50" width="294" height="124" rx="5"/><path class="accent" d="M28 153 L152 75 L292 153"/><text x="18" y="204" class="small">Context, instructions and how to explore</text><rect class="article" x="18" y="226" width="294" height="42" rx="4"/><text x="32" y="252" class="small">Scroll / continue to the upper curve</text><rect class="fillAccent" x="184" y="289" width="128" height="24" rx="12"/><text x="207" y="306" style="font-size:12px;fill:#fff">Explore →</text></g>
    <!--3 -->
    <g transform="translate(800,0)"><rect class="screen" width="330" height="340" rx="10"/><text x="18" y="29" class="label">03 · Upper curve</text><text x="18" y="51" class="small">Interactive navigation</text><rect class="muted" x="18" y="67" width="294" height="203" rx="5"/><path class="accent" d="M39 236 C83 216 100 155 142 129 S225 72 285 91"/><g fill="#fff" stroke="#155eef" stroke-width="3"><circle cx="79" cy="208" r="11"/><circle cx="137" cy="134" r="11"/><circle cx="202" cy="94" r="11"/><circle cx="267" cy="91" r="11"/></g><text x="23" y="303" class="small">Click a node to open its article</text><rect class="fillAccent" x="18" y="315" width="70" height="14" rx="7"/><text x="100" y="326" class="small">4 stories</text></g>
    <!--4 -->
    <g transform="translate(1200,0)"><rect class="screen" width="330" height="340" rx="10"/><text x="18" y="29" class="label">04 · Upper article</text><rect class="muted" x="18" y="50" width="92" height="105" rx="4"/><text x="31" y="105" class="small">Image</text><text x="128" y="76" class="small">Article title</text><path class="line" d="M128 91 H290 M128 106 H278 M128 121 H294 M128 136 H242"/><path class="line" d="M18 180 H310 M18 198 H302 M18 216 H287 M18 234 H310"/><rect class="article" x="18" y="264" width="294" height="43" rx="4"/><text x="33" y="291" class="small">Next upper-curve story →</text><text x="18" y="329" class="small">Back to curve</text></g>
    <!-- 5 -->
    <g transform="translate(0,520)"><rect class="screen" width="330" height="340" rx="10"/><text x="18" y="29" class="label">05 · Upper article</text><rect class="muted" x="18" y="50" width="294" height="112" rx="4"/><text x="28" y="113" class="small">Full-width visual / quote</text><text x="18" y="191" class="small">Article title and reading content</text><path class="line" d="M18 209 H309 M18 227 H286 M18 245 H302 M18 263 H271"/><rect class="article" x="18" y="286" width="294" height="35" rx="4"/><text x="32" y="308" class="small">Continue to the lower curve →</text></g>
    <!-- 6 -->
    <g transform="translate(400,520)"><rect class="screen" width="330" height="340" rx="10"/><text x="18" y="29" class="label">06 · Lower curve</text><text x="18" y="51" class="small">Second interactive navigation</text><rect class="muted" x="18" y="67" width="294" height="203" rx="5"/><path class="accent" d="M39 92 C83 113 101 173 142 199 S225 254 286 235"/><g fill="#fff" stroke="#155eef" stroke-width="3"><circle cx="79" cy="119" r="11"/><circle cx="137" cy="194" r="11"/><circle cx="202" cy="234" r="11"/><circle cx="267" cy="235" r="11"/></g><text x="18" y="303" class="small">Select a lower-curve story</text><rect class="fillAccent" x="18" y="315" width="70" height="14" rx="7"/><text x="100" y="326" class="small">4 stories</text></g>
    <!-- 7 -->
    <g transform="translate(800,520)"><rect class="screen" width="330" height="340" rx="10"/><text x="18" y="29" class="label">07 · Lower article</text><rect class="muted" x="18" y="50" width="92" height="105" rx="4"/><text x="31" y="105" class="small">Image</text><text x="128" y="76" class="small">Article title</text><path class="line" d="M128 91 H290 M128 106 H278 M128 121 H294 M128 136 H242"/><path class="line" d="M18 180 H310 M18 198 H302 M18 216 H287 M18 234 H310"/><rect class="article" x="18" y="264" width="294" height="43" rx="4"/><text x="33" y="291" class="small">Finish journey →</text><text x="18" y="329" class="small">Back to lower curve</text></g>
    <!-- 8 -->
    <g transform="translate(1200,520)"><rect class="screen" width="330" height="340" rx="10"/><text x="18" y="29" class="label">08 · Closing / credits</text><rect class="muted" x="18" y="50" width="294" height="132" rx="5"/><path class="accent" d="M38 154 C94 76 211 74 290 120"/><text x="40" y="126" class="small">Final reflection</text><text x="18" y="213" class="small">Summary, acknowledgements, sources</text><path class="line" d="M18 233 H309 M18 249 H270"/><rect class="fillAccent" x="18" y="280" width="128" height="24" rx="12"/><text x="42" y="297" style="font-size:12px;fill:#fff">Restart ↺</text><text x="18" y="329" class="small">Return to Home</text></g>
    <!-- arrows -->
    <path class="arrow" d="M330 170 H390"/><path class="arrow" d="M730 170 H790"/><path class="arrow" d="M1130 170 H1190"/>
    <path class="arrow" d="M1365 340 V412 H165 V510"/><path class="arrow" d="M330 690 H390"/><path class="arrow" d="M730 690 H790"/><path class="arrow" d="M1130 690 H1190"/>
  </g>
  <text x="70" y="1070" class="label">Interaction rules</text>
  <text x="70" y="1097" class="sub">Persistent controls: Home, current progress (01–08), Back. Curve nodes open their respective article view; articles return to their curve or continue along the journey.</text>
  <text x="70" y="1125" class="sub">Assumption for the two added screens: page 7 is the article selected from page 6; page 8 is the end state with a restart link.</text>
</svg>
